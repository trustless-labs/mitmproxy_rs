# Add this file to a repo as .github/workflows/factory.yml so the factory can work on its issues.
name: factory

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  issue_comment: # zizmor: ignore[dangerous-triggers] -- gated below; no untrusted code is checked out or run here
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [closed, reopened]

permissions: {}

jobs:
  factory:
    # Wake the factory for the `agent` label, for any non-bot comment on an issue it works on or on a
    # pull request a bot opened, and for non-bots' reviews and review comments there; factory-run route decides whose count.
    # When the App's pull request from an agent branch closes, the factory deletes that branch.
    # An issue that opens, closes or reopens, and the App's pull request that closes or reopens, move on the repo's board.
    if: >-
      github.event.label.name == 'agent' ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.issue.labels.*.name, 'agent') ||
        contains(github.event.issue.labels.*.name, 'agent:blocked') ||
        (github.event.issue.pull_request && github.event.issue.user.type == 'Bot'))) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.type != 'Bot' && github.event.pull_request.user.type == 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && github.event.pull_request.user.type == 'Bot') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'agent/issue-') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'Bot' && github.event.pull_request.user.login == format('{0}[bot]', vars.FACTORY_APP_SLUG))
    uses: trustless-labs/factory-config/.github/workflows/factory.yml@main # zizmor: ignore[unpinned-uses] -- the org's own config repo; its workflow names the release
    # The factory writes as its App; the jobs only need an OIDC token, to sign in to AWS.
    permissions:
      id-token: write
